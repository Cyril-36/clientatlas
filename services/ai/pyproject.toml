[project]
name = "clientatlas-ai"
version = "0.1.0"
description = "ClientAtlas AI, ingestion, retrieval, and evaluation service"
requires-python = ">=3.11,<3.14"
dependencies = [
  "asyncpg>=0.30,<1",
  "cryptography>=45,<46",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pypdf>=6.0,<7",
  "pydantic-settings>=2.10,<3",
  "pyjwt>=2.10,<3",
  "python-docx>=1.2,<2",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.35,<1"
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1"
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clientatlas_ai"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires a live PostgreSQL instance"
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["clientatlas_ai"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
