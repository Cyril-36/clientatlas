services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: clientatlas
      POSTGRES_PASSWORD: local-migration-only
      POSTGRES_USER: postgres
    ports:
      - "55432:5432"
    volumes:
      - clientatlas_postgres_data:/var/lib/postgresql/data
      - ./postgres/00-auth-compat.sql:/docker-entrypoint-initdb.d/00-auth-compat.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d clientatlas
      interval: 2s
      timeout: 3s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector:0.137.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./otel-collector.yml:/etc/otelcol/config.yml:ro
    ports:
      - "4318:4318"

  prometheus:
    image: prom/prometheus:v3.7.3
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.3.0
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  clientatlas_postgres_data:
